[package]
name = "shani-shvilin-installer"
version = "1.0.0"
description = "Shani Shvilin PC installer"
authors = ["abaye"]
edition = "2021"
publish = false

[lib]
name = "shani_installer_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# native-tls uses the OS certificate store (SChannel on Windows), so HTTPS keeps working
# behind filters that install their own root certificate, such as NetFree.
ureq = { version = "=2.12.1", default-features = false, features = ["native-tls", "gzip"] }
native-tls = "0.2"
zip = { version = "=2.6.1", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
