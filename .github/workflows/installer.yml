name: Build PC installer

# Push a tag like installer-v1.0.1 (matching installer/src-tauri/tauri.conf.json "version")
# to build the portable Windows exe and attach it to a GitHub release of this repository.
# The Pages workflow then copies it to /downloads/ShaniShvilin-Installer.exe on the site.
on:
  push:
    tags: ["installer-v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: installer/src-tauri
      - run: npm ci
      - run: npm run typecheck
      - name: Build portable exe
        run: npm run build:exe -w shani-shvilin-installer
      - name: Rename
        shell: bash
        run: |
          mkdir -p out
          cp installer/src-tauri/target/release/shani-shvilin-installer.exe out/ShaniShvilin-Installer-windows-x64.exe
          sha256sum out/*.exe > out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: out/*
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/installer-v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          name: Installer ${{ github.ref_name }}
      - name: Redeploy the site with the new installer
        if: startsWith(github.ref, 'refs/tags/installer-v')
        shell: bash
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
