name: Build PC installer (check only)

# Builds the portable Windows exe as a check that it still compiles, and keeps it as a
# workflow artifact. It does NOT publish: every published exe is signed with the code
# signing certificate, which lives on the release machine only, so a release built
# here would ship unsigned. Releases are built, signed and published locally:
#
#   1. bump "version" in installer/src-tauri/tauri.conf.json and installer/package.json
#   2. npm run build:exe -w shani-shvilin-installer
#   3. signtool sign /sha1 <thumbprint> /fd sha256 /tr http://timestamp.digicert.com /td sha256 <exe>
#   4. gh release create installer-v<version> with the signed exe and SHA256SUMS
#   5. gh workflow run pages.yml --ref main
#
# Tag pushes no longer trigger this workflow: an action publishing on a tag would
# replace the signed asset with an unsigned build of the same name.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: installer/src-tauri
      - run: npm ci
      - run: npm run typecheck
      - name: Build portable exe
        run: npm run build:exe -w shani-shvilin-installer
      - name: Rename
        shell: bash
        run: |
          mkdir -p out
          cp installer/src-tauri/target/release/shani-shvilin-installer.exe out/ShaniShvilin-Installer-windows-x64-unsigned.exe
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows-unsigned
          path: out/*
